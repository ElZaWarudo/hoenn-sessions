[workspace]
members = ["coop/crates/coop-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
