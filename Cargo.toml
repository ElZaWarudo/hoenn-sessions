[workspace]
members = ["coop/crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93.1"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["std", "zeroize"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
crc32fast = "1.5.1"
futures-util = "0.3.34"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
getrandom = "0.4.3"
hmac = "0.12.1"
http-body-util = "0.1.5"
keyring-core = "1.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
rpassword = "7.5.4"
serde_jcs = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-spawn = "=0.1.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
