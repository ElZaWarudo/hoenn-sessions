  - id: BLK-FIRST-SNAPSHOT-CLONING
    jira_issue_key: null
    unit_id: character-enrollment
    title: Prevent cloned lineage from becoming the first accepted snapshot
    wave: production-hardening
    type: security
    risk: elevated
    description: The server binds later revisions to the SaveBlock2 player name, gender, campaign region, and trainer ID from revision 1, but it has no earlier trusted lineage with which to reject a clone at the first upload.
    decision_required: Choose and implement a trusted character-enrollment or first-snapshot provenance mechanism that does not treat client-controlled save bytes as identity proof.
    impact_if_ignored: Cross-lineage replacement is detected after enrollment, but a copied eligible save can establish the initial lineage for a new or unbound cloud character.
