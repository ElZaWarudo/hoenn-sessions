  - id: BLK-MGBA-JOB
    jira_issue_key: null
    unit_id: phase2-launcher-production
    title: Close residual Windows cleanup and Job-completion gaps
    wave: production-hardening
    type: security
    risk: elevated
    description: The launcher now pins and validates the official mGBA executable, attaches both the version probe and gameplay process to a kill-on-close Job Object during creation, and performs an epoch-bound, correlated, bounded sidecar shutdown transaction before Job termination and root reaping. Fresh per-launch directories, DELETE_ON_CLOSE where supported, and final identity checks reject observed staged-file replacement and protect ordinary concurrent sessions. The final pathname-to-DELETE_ON_CLOSE open remains non-atomic against hostile same-user replacement, successful TerminateJobObject initiation plus root reaping does not prove that the Job is empty, and synchronous native calls can exceed the nominal cleanup deadline.
    decision_required: Implement or adopt an audited handle-relative cleanup boundary and a Job completion or active-process-count primitive, or explicitly exclude hostile same-user replacement and strict descendant-emptiness proof from the supported threat model.
    impact_if_ignored: Ordinary sessions remain fail-closed and process-tree containment is locally exercised, but an adversarial local peer can race staged-name cleanup, and the launcher cannot make a strict claim that no Job descendant remains or that uncancellable native cleanup always finishes inside the nominal wall-clock deadline.
    affected_units: [phase2-launcher-core, distribution]
    blocks_dependents: false
    suggested_owner: security lead
    detected_at: "2026-09-01T22:13:50Z"
    status: open
    evidence: The exactly pinned windows-spawn 0.1.0 boundary performs creation-time Job attachment. Independent tests cover probe and gameplay descendants, cancellation, bounded authenticated shutdown acknowledgements and replay within one sidecar process, forced fallback, typed cleanup evidence, staged-file replacement rejection, concurrent-session isolation, and recovery-marker retention. The dependency does not expose a Job-empty oracle or make synchronous Windows calls cancellable.
    next_action: Audit and implement handle-relative staged-file cleanup plus a Job completion/count primitive, then certify the residual hostile-local-peer and deadline cases before public distribution.
    resolution:
      decided_at: null
      decided_by: null
      decision: null
