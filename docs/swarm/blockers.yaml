  - id: BLK-MGBA-JOB
    jira_issue_key: null
    unit_id: phase2-launcher-production
    title: Complete Windows mGBA containment, binary trust, and graceful shutdown
    wave: production-hardening
    type: security
    risk: elevated
    description: Stable safe Rust does not expose the Windows attributed-process API needed to place the mGBA version probe in a Job Object before its first instruction, and the selected mGBA binary is version-checked but not yet bound to a published vendor digest. The launcher has a tested bounded forced kill-and-reap fallback, but the current authenticated control protocol has no graceful-shutdown request and acknowledgement to attempt before that fallback. Fresh per-launch directories, DELETE_ON_CLOSE where supported, and final identity checks reject observed staged-file replacement and protect ordinary concurrent sessions, but safe standard-library name-based cleanup is not atomic against a hostile same-user replacement during the pre-open interval.
    decision_required: Audit and pin a safe atomic Job Object spawn dependency or isolate an audited Windows FFI boundary, publish the accepted mGBA binary digest in the compatibility manifest, define an authenticated bounded graceful-shutdown exchange that falls back to the existing forced kill-and-reap path, and use an audited handle-based cleanup primitive where same-user hostile replacement is in scope.
    impact_if_ignored: The launcher fails closed when cleanup cannot be confirmed and its bounded forced fallback is locally proven, but a supplied executable could create a detached descendant before PID-based cleanup, the launcher cannot request an orderly emulator flush before force, and a hostile same-user process retains a narrow name-resolution race against staged-file cleanup; production process-tree containment and graceful shutdown cannot be claimed.
    affected_units: [phase2-launcher-core, distribution]
    blocks_dependents: false
    suggested_owner: security lead
    detected_at: "2026-09-01T22:13:50Z"
    status: open
    evidence: Independent launcher review identified atomic Job Object attachment, authenticated shutdown, and atomic same-user-resistant name-to-handle cleanup as unavailable through the current safe standard-library boundary; local tests pass for bounded forced kill/reap, typed fail-closed cleanup, observed replacement rejection, ordinary concurrent-session isolation, and marker retention.
    next_action: Evaluate audited atomic Windows spawn and handle-based cleanup boundaries, pin the vendor binary digest, and add an authenticated graceful-shutdown acknowledgement with a strict deadline before public distribution.
    resolution:
      decided_at: null
      decided_by: null
      decision: null
