name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer commit supersedes the previous validation of the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  changes:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-24.04
    outputs:
      rom: ${{ steps.select.outputs.rom }}
      rust: ${{ steps.select.outputs.rust }}
      installer: ${{ steps.select.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI change selection
        run: python3 .github/ci/test_classify_changes.py
      - name: Select required checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python3 .github/ci/classify_changes.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 .github/ci/classify_changes.py --all >> "$GITHUB_OUTPUT"
          fi

  build-emerald:
    needs: changes
    if: needs.changes.outputs.rom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Generate Android compatibility manifest from the same ROM
        run: python3 tools/generate_bridge_manifest.py --elf pokeemerald.elf --rom pokeemerald.gba

      - name: Set up Android Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: 'false'

      - name: Build and verify bundled Android APK
        run: bash android/build-ci.sh debug
        # This public repository must not publish ROM-bearing APKs as artifacts.

  build-firered:
    needs: changes
    if: needs.changes.outputs.rom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: ROM (Firered)
        run: make firered -j$(nproc) -O

  build-leafgreen:
    needs: changes
    if: needs.changes.outputs.rom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: ROM (Leafgreen)
        run: make leafgreen -j$(nproc) -O

  release:
    needs: changes
    if: needs.changes.outputs.rom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: Release
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release

  build-test-rom:
    needs: changes
    if: needs.changes.outputs.rom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: Test host runner sharding and failure reporting
        run: |
          make -f make_tools.mk check-tools
          python3 tools/mgba-rom-test-hydra/test_sharding.py

      - name: Build test ROM once
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) -O check-build

      - name: Check battle-to-function test isolation
        env:
          MAKEFLAGS: -j1
        run: |
          cp pokeemerald-test-headless.elf test-isolation.elf
          tools/patchelf/patchelf test-isolation.elf gTestRunnerArgv 'test/test_test_runner.c\0'
          tools/mgba-rom-test-hydra/mgba-rom-test-hydra \
            tools/mgba/mgba-rom-test unused-objcopy test-isolation.elf

      - name: Package test runtime with executable permissions
        run: |
          tar -czf test-runtime.tar.gz pokeemerald-test-headless.elf \
            tools/patchelf/patchelf tools/mgba-rom-test-hydra/mgba-rom-test-hydra \
            tools/mgba/mgba-rom-test

      - name: Upload shared test runtime
        uses: actions/upload-artifact@v4
        with:
          name: test-runtime
          path: test-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload test ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rom
          path: pokeemerald-test*.elf
          retention-days: 7

  test:
    needs: build-test-rom
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Download shared test runtime
        uses: actions/download-artifact@v4
        with:
          name: test-runtime

      - name: Run test shard
        env:
          # Every shard must use the same local worker count and ELF.
          MAKEFLAGS: -j4
          TEST_SHARD_COUNT: 4
          TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          tar -xzf test-runtime.tar.gz
          tools/mgba-rom-test-hydra/mgba-rom-test-hydra \
            tools/mgba/mgba-rom-test unused-objcopy pokeemerald-test-headless.elf

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
          cache-workspace-crates: 'false'
          cache-all-crates: 'false'
          cache-bin: 'false'
      - name: Rust tests
        run: cargo test --locked --workspace --exclude coop-android
      - name: Release script tests
        run: bash deploy/coop/test-release-scripts.sh

  installer-package-smoke:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.203

      - name: Check installer source invariants
        shell: pwsh
        run: ./installer/windows/tests/installer-smoke.ps1 -StaticOnly

      - name: Compile MSI package with test inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testInput = Join-Path $env:RUNNER_TEMP 'installer-smoke-input.bin'
          [IO.File]::WriteAllBytes($testInput, [byte[]]@(0))
          $project = 'installer/windows/HoennSessions.wixproj'
          dotnet restore $project --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'WiX restore failed' }
          dotnet build $project --configuration Release --no-restore `
            "-property:BootstrapExe=$testInput" `
            "-property:OnboardingExe=$testInput" `
            "-property:ConfigFile=$testInput" `
            "-property:NoticesFile=$testInput" `
            '-property:ProductVersion=1.0.1'
          if ($LASTEXITCODE -ne 0) { throw 'WiX package compilation failed' }

  # The shipped mGBA bridge scripts are plain Lua with their own suites.
  # Lua 5.4 matches the API mGBA embeds (integers, math.type, string.pack).
  # This job always runs: it is cheap and guards the cross-language contract.
  bridge-lua:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4

      - name: Bridge Lua suites
        run: |
          lua5.4 bridge/tests/main_test.lua
          lua5.4 bridge/tests/memory_test.lua
          lua5.4 bridge/tests/protocol_test.lua

  tools-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python tool suites
        run: |
          python3 -m unittest discover -s tools/tests -p "test_*.py"

  # Gate job: satisfies the "build" branch protection rule.
  # Validate intentional skips as well as failures; a skipped gate is not a pass.
  build:
    if: always() && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-24.04
    needs: [changes, build-emerald, build-firered, build-leafgreen, release, build-test-rom, test, rust, installer-package-smoke, bridge-lua, tools-tests]
    steps:
      - name: Check every required job
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOBS'])
          assert jobs['changes']['result'] == 'success', 'change selection failed'
          groups = {
              'rom': ['build-emerald', 'build-firered', 'build-leafgreen', 'release', 'build-test-rom', 'test'],
              'rust': ['rust'],
              'installer': ['installer-package-smoke'],
          }
          for group, names in groups.items():
              selected = jobs['changes']['outputs'][group]
              assert selected in ('true', 'false'), f'invalid selection: {group}'
              expected = 'success' if selected == 'true' else 'skipped'
              for name in names:
                  assert jobs[name]['result'] == expected, f'{name}: {jobs[name]["result"]}, expected {expected}'
          assert jobs['bridge-lua']['result'] == 'success', f'bridge-lua: {jobs["bridge-lua"]["result"]}, expected success'
          assert jobs['tools-tests']['result'] == 'success', f'tools-tests: {jobs["tools-tests"]["result"]}, expected success'
          print('All required builds and tests passed.')
          PY

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
