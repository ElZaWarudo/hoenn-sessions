# Build proof for every registered travel world. Short-lived artifacts support
# emulator verification; promotion is separate.
name: Multiworld build validation

on:
  push:
    branches:
      - codex/dreamstone-region
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  GAME_VERSION: EMERALD
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-worlds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install ARM/GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3

      - name: Cache ROM build tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-v2-ubuntu24-${{ runner.arch }}-${{ hashFiles('make_tools.mk', 'tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'include/**/*.h') }}

      - name: Build registered worlds and manifests
        run: python3 tools/coop/multiworld_build_ci.py build

      - name: Verify registered world builds
        run: python3 tools/coop/multiworld_build_ci.py verify

      - name: Retain ROMs and manifests for emulator verification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: multiworld-emulator-candidate
          path: |
            dist/multiworld/*/game.gba
            dist/multiworld/*/bridge_manifest.json
            dist/multiworld/*/player_transfer_manifest.json
            dist/multiworld/*/experience_table_manifest.json
            dist/multiworld/*/map_binding_manifest.json
            dist/multiworld/*/object_scalar_manifest.json
            dist/multiworld/*/generated_addresses.lua
          if-no-files-found: error
          retention-days: 2
